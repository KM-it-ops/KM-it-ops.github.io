<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>404 · Sheet not in set · Mahmoud Al Kurdi (Michael Kurdi)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face{font-family:"Unbounded";src:url("/fonts/unbounded.woff2") format("woff2");font-weight:200 900;font-display:swap}
      @font-face{font-family:"Red Hat Text";src:url("/fonts/redhattext.woff2") format("woff2");font-weight:300 700;font-display:swap}
      @font-face{font-family:"Roboto Mono";src:url("/fonts/robotomono.woff2") format("woff2");font-weight:100 700;font-display:swap}
      :root{--page:#071B33;--sheet:#0B2747;--line:#7CC4F5;--text:#EEF5FF;--muted:#B4CBE6;--cyan:#7FD8FF;--amber:#FFC56B;--cta-bg:#FFC56B;--cta-fg:#071B33;--focus:#FFC56B;--g:rgba(124,196,245,.07)}
      @media (prefers-color-scheme: light){:root{--page:#E4DECD;--sheet:#FBF7EC;--line:#2B66A8;--text:#0D2138;--muted:#33506F;--cyan:#0A4F99;--amber:#8A4500;--cta-bg:#0D3A6E;--cta-fg:#FFFFFF;--focus:#A84300;--g:rgba(43,102,168,.06)}}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--page);color:var(--text);font:400 1.0625rem/1.6 "Red Hat Text",system-ui,sans-serif}
      .sheet{position:relative;width:min(100%,640px);padding:56px clamp(20px,5vw,48px) 40px;background:var(--sheet);border:1.5px solid var(--line);outline:1px solid var(--line);outline-offset:-10px;
        background-image:linear-gradient(var(--g) 1px,transparent 1px),linear-gradient(90deg,var(--g) 1px,transparent 1px);background-size:24px 24px}
      .tag{position:absolute;top:20px;left:clamp(20px,5vw,48px);margin:0;font:500 .8125rem/1 "Roboto Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
      h1{font:700 clamp(2.5rem,1.5rem + 5vw,4.5rem)/1 "Unbounded","Arial Black",sans-serif;margin:.2em 0 .25em}
      p{margin:0 0 1rem;max-width:52ch}
      a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;background:var(--cta-bg);color:var(--cta-fg);font:600 1rem "Red Hat Text",system-ui,sans-serif;text-decoration:none;border:1.5px solid var(--cta-bg)}
      a{color:var(--cyan)}
      a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
      .lbl{font:500 .8125rem/1.35 "Roboto Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    </style>
  </head>
  <body>
    <main class="sheet">
      <p class="tag">Sheet 404 · Not in set</p>
      <h1>404</h1>
      <p>This page is not part of the drawing set.</p>
      <p><a class="btn" href="/">Back to the cover sheet</a></p>
      <p class="lbl">Mahmoud Al Kurdi (Michael Kurdi) · Charlotte, NC · Remote</p>
    </main>
  </body>
</html>
